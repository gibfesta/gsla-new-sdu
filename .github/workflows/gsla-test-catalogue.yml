name: GSLA test catalogue validation (untrusted PR)
on:
  pull_request:
    paths:
      - "tests/automated/**"
      - "tests/browser/**"
      - ".github/workflows/gsla-test-catalogue.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install locked browser dependencies
        working-directory: tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Chromium installation
        working-directory: tests/browser
        run: |
          npx playwright install --with-deps chromium
          node -e "const { chromium } = require('playwright'); chromium.launch({headless:true}).then(b => b.close()).then(() => console.log('PASS Chromium launch')).catch(() => process.exit(1))"
      - name: Validate catalogue and PASS FAIL BLOCKED NOT RUN states
        run: node tests/browser/self-test.cjs
      - name: Assert blocked-run evidence is redacted
        working-directory: tests/browser
        run: |
          set +e
          GSLA_TEST_COMMIT="SYNTHETIC_SECRET_DO_NOT_LOG_826401" GSLA_TEST_DEPLOYMENT="dpl_SYNTHETIC" node run.cjs
          rc=$?
          set -e
          test "$rc" -eq 3
          ! grep -R -F "SYNTHETIC_SECRET_DO_NOT_LOG_826401" ../../test-results/gsla-audit
          node -e "const fs=require('fs');const d='../../test-results/gsla-audit';const f=fs.readdirSync(d).find(x=>x.endsWith('.json'));const r=JSON.parse(fs.readFileSync(d+'/'+f));if(r.summary.BLOCKED!==11||r.summary['NOT RUN']!==1||r.summary.PASS!==0)process.exit(1);console.log('PASS blocked evidence '+r.runId+' (11 BLOCKED, 1 NOT RUN)')"
# No secrets, auth sessions, Preview bypass credentials, privileged contexts,
# external app requests, artifact uploads, pull_request_target or deployment writes.
# Credentialed Preview workflow requires separate authorisation and review.

  verify-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint check (existing repository issues tracked separately)
        continue-on-error: true
        run: npm run lint
      - name: Production build
        run: npm run build
